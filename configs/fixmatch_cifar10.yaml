method: fixmatch
seed: 42

data:
  dataset: cifar10
  root: ./data
  num_labeled: 250
  include_labeled_in_unlabeled: true
  num_workers: 4
  subset_train: null
  subset_test: null

model:
  name: wideresnet
  depth: 28
  widen_factor: 2
  dropout: 0.0

training:
  epochs: 200
  steps_per_epoch: null
  batch_size_labeled: 64
  mu: 7
  lr: 0.03
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  lambda_u: 1.0
  amp: true
  use_model_ema: false

fixmatch:
  threshold: 0.95

adaptive:
  enabled: false
  beta: 0.9
  tau_min: 0.80
  tau_max: 0.95
  warmup_fraction: 0.10
  update_from: all_predictions

logging:
  log_every_steps: 50
  eval_every_epochs: 1
  save_every_epochs: 10

device: cuda
