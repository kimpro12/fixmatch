method: fixmatch
seed: 42

data:
  dataset: cifar10
  root: ./data
  num_labeled: 250
  include_labeled_in_unlabeled: true
  num_workers: 2
  subset_train: 1024
  subset_test: 512

model:
  name: wideresnet
  depth: 16
  widen_factor: 1
  dropout: 0.0

training:
  epochs: 1
  steps_per_epoch: 5
  batch_size_labeled: 8
  mu: 2
  lr: 0.03
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  lambda_u: 1.0
  amp: false
  use_model_ema: false

fixmatch:
  threshold: 0.95

adaptive:
  enabled: false
  beta: 0.9
  tau_min: 0.80
  tau_max: 0.95
  warmup_fraction: 0.10
  update_from: all_predictions

logging:
  log_every_steps: 1
  eval_every_epochs: 1
  save_every_epochs: 1

device: cpu
